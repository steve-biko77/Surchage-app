name: Nudge Journal

on:
  schedule:
    # Toutes les heures, 5h-20h UTC = 6h-21h Paris (hiver) / 7h-22h Paris (ete).
    # La route elle-meme filtre 6h-22h en heure locale Europe/Paris (voir app/api/cron/nudge),
    # ce qui absorbe le decalage ete/hiver -- ce cron n'a pas besoin d'etre ajuste deux fois par an.
    - cron: "0 5-20 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la route de nudge adaptatif
        run: |
          curl -fsS -X POST https://journal-productivity.vercel.app/api/cron/nudge \
            -H "Authorization: Bearer ${{ secrets.NUDGE_SECRET }}"
